name: Bug report
description: Something in Vader does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Security problems: please do not file them here**, use [private reporting](https://github.com/qwzx4893-stack/Vader/security/advisories/new).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A minimal project or prompt helps most.
    validations:
      required: true
  - type: textarea
    id: about
    attributes:
      label: Help > About
      description: Press Ctrl/Cmd+Shift+P, run `Help: About`, and paste the version information.
      render: text
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model and provider
      description: For agent or chat problems (for example `gpt-4o` via OpenAI, or `qwen2.5-coder` via Ollama).
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Chat / agent, Policy / approvals, Terminal, Browser tool, MCP / marketplace, Editing (Ctrl+K / Apply), Installer / startup, Privacy, Other]
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Developer Tools console output (Help > Toggle Developer Tools) is very useful. Remove any secrets first.
