name: Windows Build

# Produces a real Vader Windows package, built natively on a Windows runner - this
# project's own build tooling (build/lib/electron.ts) always fetches Electron for the
# host's own platform, matching how this repo's other platform CI configs work
# (build/azure-pipelines/{win32,linux,darwin}/), so a Windows build has to run on Windows;
# it cannot be cross-compiled from Linux. See docs/integrations/windows-build.md.

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture'
        required: true
        default: 'x64'
        type: choice
        options: [x64, arm64]
      publish:
        description: 'Publish a GitHub Release from this build (leave off for branch validation builds)'
        required: true
        default: false
        type: boolean
      remove_previous_releases:
        description: 'With publish: delete every other release (and its tag) once the new one is published'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'product.json'
      - 'package.json'
      - 'build/win32/**'
      - 'build/gulpfile.vscode.win32.js'
      - '.github/workflows/windows-build.yml'

# Least privilege: the build only reads the repository. Publishing a release is a separate job that alone
# holds `contents: write`, and it only runs when a release is explicitly requested.
permissions:
  contents: read

jobs:
  build:
    name: Build Windows (${{ github.event.inputs.arch || 'x64' }})
    # Pinned rather than `windows-latest`: a real run of this workflow found `windows-latest`'s
    # current image ships a Visual Studio release ("18") that this Node/npm version's bundled
    # node-gyp doesn't recognize (`gyp ERR! find VS unknown version "undefined"`), so any native
    # module build (@vscode/deviceid, @vscode/sqlite3, ...) fails outright before anything
    # Vader-specific is even reached. windows-2022 is GitHub's long-established, still-supported
    # Windows runner image with a Visual Studio version node-gyp reliably detects.
    runs-on: windows-2022
    # A real dispatch of this workflow found "Package Windows application" (gulp's
    # vscode-win32-x64-min task) alone taking 40+ minutes on a cold, uncached windows-2022
    # runner: that single gulp task chains a full mangled recompile, a full re-compile of every
    # built-in extension, esbuild-based minification, and packaging thousands of files onto
    # Windows/NTFS (slower per-file than Linux, and typically further slowed by the runner's
    # real-time antivirus scanning) - all sequentially, with no build cache warm on a first run.
    # Investigated for an actual hang (a stuck network call, a deadlock) and found none - the
    # code path here is genuinely this heavy, and 90 minutes was an unrealistic budget for it.
    timeout-minutes: 150
    env:
      ARCH: ${{ github.event.inputs.arch || 'x64' }}
      NPM_CONFIG_ARCH: ${{ github.event.inputs.arch || 'x64' }}
      # Empty unless the repository defines it; only used to decide whether the signing step runs.
      WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
      # No secrets are embedded here: this produces an unsigned build. A real release
      # pipeline would add code-signing via a separate, secret-backed step - do not add
      # signing credentials to this workflow file directly.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      - name: Setup Python (for native module builds)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        # `npm install`, not `npm ci`: build/npm/postinstall.ts re-runs the same npm command in every sub-package (extensions/, build/...), and
        # `npm ci` there fails on this tree (verified on the runner). Both honour package-lock.json; the shipped-advisory gate checks the result.
        run: npm install

      - name: Install extension dependencies
        run: node build/npm/postinstall.ts

      - name: Build React chat/settings UI
        run: npm run buildreact

      - name: Build Cline agent runtime bundle
        run: npm run buildcline

      - name: Compile
        run: npm run compile-client

      - name: Fetch Electron
        run: node build/lib/electron.ts $env:ARCH

      # The packaging task strips/inspects Authenticode signatures on bundled native files with
      # signtool.exe (Windows SDK). It is installed on the runner but not on PATH.
      - name: Put signtool on PATH
        shell: pwsh
        run: |
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found in the Windows SDK' }
          "signtool: $($signtool.FullName)"
          $signtool.DirectoryName >> $env:GITHUB_PATH

      - name: Package Windows application
        run: npm run gulp vscode-win32-%ARCH%-min
        shell: cmd

      # Catches the "installed app dies at startup with ERR_MODULE_NOT_FOUND" class of bug on the
      # real bundles, before an installer is even built.
      - name: Check main-process bundles import only resolvable packages
        run: node src/vs/workbench/contrib/vader/test/packagedImportsE2E.mjs out-vscode-min

      - name: Build Inno Setup updater icon
        run: npm run gulp vscode-win32-%ARCH%-inno-updater
        shell: cmd

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
        shell: cmd

      - name: Build installer
        run: npm run gulp vscode-win32-%ARCH%-user-setup
        shell: cmd

      - name: Locate build output
        id: locate
        shell: pwsh
        run: |
          $appDir = Get-ChildItem -Path ".." -Directory -Filter "VSCode-win32-*" | Select-Object -First 1
          if ($appDir) {
            echo "app_dir=$($appDir.FullName)" >> $env:GITHUB_OUTPUT
          }
          $setup = Get-ChildItem -Path ".build\win32-$env:ARCH" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($setup) {
            echo "setup_exe=$($setup.FullName)" >> $env:GITHUB_OUTPUT
          }

      # Optional code signing. Skipped (the installer stays unsigned) unless the repository defines both secrets
      # WINDOWS_CERT_PFX_BASE64 (the .pfx, base64) and WINDOWS_CERT_PASSWORD. NOT exercised yet: no certificate has been
      # provided, so this step has only ever been skipped. signtool.exe is already on PATH (see the step above).
      - name: Sign installer (only when a certificate is configured)
        if: steps.locate.outputs.setup_exe != '' && env.WINDOWS_CERT_PFX_BASE64 != ''
        shell: pwsh
        env:
          SETUP_EXE: ${{ steps.locate.outputs.setup_exe }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          try {
            signtool sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd sha256 /tr http://timestamp.digicert.com /td sha256 $env:SETUP_EXE
            if ($LASTEXITCODE -ne 0) { throw "signtool sign failed ($LASTEXITCODE)" }
            signtool verify /pa $env:SETUP_EXE
            if ($LASTEXITCODE -ne 0) { throw "signature did not verify ($LASTEXITCODE)" }
          } finally { Remove-Item $pfx -Force -ErrorAction SilentlyContinue }

      - name: Upload unpacked application
        if: steps.locate.outputs.app_dir != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vader-win32-${{ env.ARCH }}-unpacked
          path: ${{ steps.locate.outputs.app_dir }}
          retention-days: 14

      - name: Upload installer
        if: steps.locate.outputs.setup_exe != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vader-win32-${{ env.ARCH }}-setup
          path: ${{ steps.locate.outputs.setup_exe }}
          retention-days: 14

  # Only runs for an explicit release request, and is the only place with write access to repository contents.
  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ARCH: ${{ github.event.inputs.arch || 'x64' }}
    steps:
      - name: Checkout (package.json only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            product.json
            package.json
          sparse-checkout-cone-mode: false

      - name: Download installer built by this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vader-win32-${{ env.ARCH }}-setup
          path: dist

      # The release carries Vader's own product version (product.json "vaderVersion"), not the version of the VS Code base it is
      # built on, and the installer is named Vader-Setup-<arch>-<version>.exe. Idempotent: a re-dispatch replaces an earlier
      # attempt at the same version.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          REMOVE_PREVIOUS: ${{ github.event.inputs.remove_previous_releases }}
        run: |
          ver="$(node -p "require('./product.json').vaderVersion")"
          base="$(node -p "require('./package.json').version")"
          tag="v${ver}"
          src="$(ls dist/*.exe | head -n 1)"
          setup="dist/Vader-Setup-${ARCH}-${ver}.exe"
          mv "$src" "$setup"
          cat > notes.md <<NOTES
          # Vader ${ver}

          An AI-native code editor: a full IDE with a built-in coding agent, a hard policy engine, permanent and temporary agents,
          MCP, browser automation, checkpoints and a verification pipeline, and 49 model providers (hosted and local) with the
          model list fetched live from your key. Built on the VS Code ${base} workbench.

          **Install:** download \`Vader-Setup-${ARCH}-${ver}.exe\` below and run it (Windows ${ARCH}). The installer is unsigned unless this
          repository has code-signing secrets configured, so Windows SmartScreen may ask you to confirm.

          Built from commit ${GITHUB_SHA} by this repository's own Windows CI (.github/workflows/windows-build.yml).
          See CHANGELOG.md for what is in this release and FINAL_PRODUCTION_READINESS_REPORT.md for what has and has not been verified.
          NOTES
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" "$setup" --title "Vader ${ver}" --notes-file notes.md --target "$GITHUB_SHA" --latest
          if [ "$REMOVE_PREVIOUS" = "true" ]; then
            gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r old; do
              [ "$old" = "$tag" ] && continue
              echo "removing previous release $old"
              gh release delete "$old" --yes --cleanup-tag
            done
          fi
