name: Windows Build

# Produces a real Vader Windows package, built natively on a Windows runner - this
# project's own build tooling (build/lib/electron.ts) always fetches Electron for the
# host's own platform, matching how this repo's other platform CI configs work
# (build/azure-pipelines/{win32,linux,darwin}/), so a Windows build has to run on Windows;
# it cannot be cross-compiled from Linux. See docs/integrations/windows-build.md.

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture'
        required: true
        default: 'x64'
        type: choice
        options: [x64, arm64]
      publish:
        description: 'Publish a GitHub Release from this build (leave off for branch validation builds)'
        required: true
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'product.json'
      - 'package.json'
      - 'build/win32/**'
      - 'build/gulpfile.vscode.win32.js'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows (${{ github.event.inputs.arch || 'x64' }})
    # Pinned rather than `windows-latest`: a real run of this workflow found `windows-latest`'s
    # current image ships a Visual Studio release ("18") that this Node/npm version's bundled
    # node-gyp doesn't recognize (`gyp ERR! find VS unknown version "undefined"`), so any native
    # module build (@vscode/deviceid, @vscode/sqlite3, ...) fails outright before anything
    # Vader-specific is even reached. windows-2022 is GitHub's long-established, still-supported
    # Windows runner image with a Visual Studio version node-gyp reliably detects.
    runs-on: windows-2022
    # A real dispatch of this workflow found "Package Windows application" (gulp's
    # vscode-win32-x64-min task) alone taking 40+ minutes on a cold, uncached windows-2022
    # runner: that single gulp task chains a full mangled recompile, a full re-compile of every
    # built-in extension, esbuild-based minification, and packaging thousands of files onto
    # Windows/NTFS (slower per-file than Linux, and typically further slowed by the runner's
    # real-time antivirus scanning) - all sequentially, with no build cache warm on a first run.
    # Investigated for an actual hang (a stuck network call, a deadlock) and found none - the
    # code path here is genuinely this heavy, and 90 minutes was an unrealistic budget for it.
    timeout-minutes: 150
    env:
      ARCH: ${{ github.event.inputs.arch || 'x64' }}
      NPM_CONFIG_ARCH: ${{ github.event.inputs.arch || 'x64' }}
      # No secrets are embedded here: this produces an unsigned build. A real release
      # pipeline would add code-signing via a separate, secret-backed step - do not add
      # signing credentials to this workflow file directly.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Setup Python (for native module builds)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm install

      - name: Install extension dependencies
        run: node build/npm/postinstall.ts

      - name: Build React chat/settings UI
        run: npm run buildreact

      - name: Build Cline agent runtime bundle
        run: npm run buildcline

      - name: Compile
        run: npm run compile-client

      - name: Fetch Electron
        run: node build/lib/electron.ts ${{ env.ARCH }}

      # The packaging task strips/inspects Authenticode signatures on bundled native files with
      # signtool.exe (Windows SDK). It is installed on the runner but not on PATH.
      - name: Put signtool on PATH
        shell: pwsh
        run: |
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found in the Windows SDK' }
          "signtool: $($signtool.FullName)"
          $signtool.DirectoryName >> $env:GITHUB_PATH

      - name: Package Windows application
        run: npm run gulp vscode-win32-${{ env.ARCH }}-min
        shell: cmd

      # Catches the "installed app dies at startup with ERR_MODULE_NOT_FOUND" class of bug on the
      # real bundles, before an installer is even built.
      - name: Check main-process bundles import only resolvable packages
        run: node src/vs/workbench/contrib/void/test/packagedImportsE2E.mjs out-vscode-min

      - name: Build Inno Setup updater icon
        run: npm run gulp vscode-win32-${{ env.ARCH }}-inno-updater
        shell: cmd

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
        shell: cmd

      - name: Build installer
        run: npm run gulp vscode-win32-${{ env.ARCH }}-user-setup
        shell: cmd

      - name: Locate build output
        id: locate
        shell: pwsh
        run: |
          $appDir = Get-ChildItem -Path ".." -Directory -Filter "VSCode-win32-*" | Select-Object -First 1
          if ($appDir) {
            echo "app_dir=$($appDir.FullName)" >> $env:GITHUB_OUTPUT
          }
          $setup = Get-ChildItem -Path ".build\win32-$env:ARCH" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($setup) {
            echo "setup_exe=$($setup.FullName)" >> $env:GITHUB_OUTPUT
          }

      - name: Upload unpacked application
        if: steps.locate.outputs.app_dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: vader-win32-${{ env.ARCH }}-unpacked
          path: ${{ steps.locate.outputs.app_dir }}
          retention-days: 14

      - name: Upload installer
        if: steps.locate.outputs.setup_exe != ''
        uses: actions/upload-artifact@v4
        with:
          name: vader-win32-${{ env.ARCH }}-setup
          path: ${{ steps.locate.outputs.setup_exe }}
          retention-days: 14

      - name: Determine release version
        id: version
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true'
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          echo "tag=v$($pkg.version)" >> $env:GITHUB_OUTPUT

      # Manual-dispatch only, deliberately: this repo's own build tooling can only produce a
      # Windows package on a Windows runner (see this workflow's header comment), so a real
      # GitHub Release with a real installer attached has to be published from here rather than
      # by a separate process. Gated to workflow_dispatch (not the push trigger above) so a
      # routine CI build from a path-matching push to main never spams a new release - this step
      # only runs when someone/something explicitly asks for a release, not on every build.
      # Idempotent (deletes any prior release/tag of the same name first) so a re-dispatch after
      # fixing a build failure cleanly replaces a previous, incomplete attempt at the same version
      # rather than failing on "tag already exists" or leaving stale duplicate releases behind.
      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true' && steps.locate.outputs.setup_exe != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $sha = "${{ github.sha }}"
          $arch = "${{ env.ARCH }}"
          $notes = @"
          Vader Windows build ($arch), built from ``main`` @ ``$sha``.

          This is the current Vader Windows release: an **unsigned** build produced by this
          repository's own Windows CI workflow (``.github/workflows/windows-build.yml``),
          packaged with Inno Setup. See ``FINAL_PRODUCTION_READINESS_REPORT.md`` in the
          repository for the full, evidence-tagged account of what has and has not been
          independently verified in this build - in particular, no interactive (LIVE-UI) or
          real-model run has been performed against this exact artifact.
          "@
          gh release delete $tag --yes --cleanup-tag 2>$null
          gh release create $tag "${{ steps.locate.outputs.setup_exe }}" `
            --title "Vader $tag (Windows $arch)" `
            --notes $notes `
            --target $sha
