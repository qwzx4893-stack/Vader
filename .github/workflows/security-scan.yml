name: Security Scan

# The strongest set of independent scanners we can run, each looking at something different:
#   codeql        - semantic data-flow analysis of Vader's own TypeScript (security-extended query suite)
#   semgrep       - pattern rules (OWASP top ten, JS/TS, Electron, secrets) over the same code
#   gitleaks      - secrets in the whole git history
#   osv           - known-vulnerable dependencies from package-lock.json (OSV database, the broadest advisory source)
#   zizmor        - GitHub Actions workflow security (injection, over-broad permissions, unpinned actions)
#   electron      - Electron security-configuration checks (Electronegativity)
#   signatures    - npm registry signatures / provenance of every installed package
# Every job prints a readable summary into its log and uploads the raw SARIF; none of them fails the run, so one noisy
# scanner cannot hide the others. Triage lives in docs/integrations/security-scan.md.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/security-scan.yml', '.github/codeql/**', '.github/scripts/sarif_summary.py']
  pull_request:
    paths: ['package.json', 'package-lock.json', '**/package-lock.json', '.github/workflows/**']
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml
          build-mode: none
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: vader
          upload: never
          output: codeql-sarif
      - name: Summary
        if: always()
        run: python3 .github/scripts/sarif_summary.py CodeQL codeql-sarif --limit 120
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sarif-codeql
          path: codeql-sarif
          if-no-files-found: ignore

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run Semgrep
        continue-on-error: true
        run: |
          pip install --quiet semgrep
          semgrep scan --metrics=off --disable-version-check --quiet \
            --config p/security-audit --config p/owasp-top-ten --config p/javascript --config p/typescript --config p/nodejs --config p/secrets --config p/xss \
            --sarif -o semgrep.sarif \
            src/vs/workbench/contrib/vader/browser src/vs/workbench/contrib/vader/common src/vs/workbench/contrib/vader/electron-main build/next build/lib/vader src/vs/code/electron-main
      - name: Summary
        if: always()
        run: python3 .github/scripts/sarif_summary.py Semgrep semgrep.sarif --limit 120
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sarif-semgrep
          path: semgrep.sarif
          if-no-files-found: ignore

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan the whole history for secrets
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 detect --source /repo --redact --no-banner \
            --report-format sarif --report-path /repo/gitleaks.sarif --exit-code 0
      - name: Summary
        if: always()
        run: python3 .github/scripts/sarif_summary.py Gitleaks gitleaks.sarif --limit 80
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sarif-gitleaks
          path: gitleaks.sarif
          if-no-files-found: ignore

  osv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: OSV scan of package-lock.json
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.3.8 scan source --lockfile=/src/package-lock.json --format=json --output-file=/src/osv.json || true
          python3 - <<'PY'
          import json, collections
          d = json.load(open('osv.json'))
          sev = collections.Counter(); rows = []
          for res in d.get('results', []):
              for pkg in res.get('packages', []):
                  p = pkg['package']
                  for g in pkg.get('groups', []):
                      ids = g.get('ids', [])
                      s = g.get('max_severity') or '?'
                      sev[s[:3]] += 1
                      rows.append((float(s) if s.replace('.', '', 1).isdigit() else 0, p['name'], p['version'], ids[0] if ids else '?'))
          print(f'===== OSV: {len(rows)} advisory groups')
          for score, name, ver, vid in sorted(rows, reverse=True)[:80]:
              print(f'{score:5}  {name}@{ver}  {vid}')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: osv
          path: osv.json
          if-no-files-found: ignore

  signatures:
    # npm registry signatures and provenance of every installed package (supply-chain tampering check). Reported, never blocks.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - name: Install without running scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify registry signatures
        continue-on-error: true
        run: npm audit signatures

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit workflows
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install --quiet zizmor
          zizmor --no-progress --format plain .github/workflows || true
          zizmor --no-progress --format sarif .github/workflows > zizmor.sarif || true

  electron:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Electronegativity (Electron security configuration)
        continue-on-error: true
        run: |
          npx --yes @doyensec/electronegativity@1.10.3 -i src/vs/code/electron-main -i src/main.ts -i src/vs/platform/windows/electron-main -i src/vs/workbench/electron-browser -o electronegativity.sarif -r sarif || true
          python3 .github/scripts/sarif_summary.py Electronegativity electronegativity.sarif --limit 80
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sarif-electronegativity
          path: electronegativity.sarif
          if-no-files-found: ignore
