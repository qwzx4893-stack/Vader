name: CI

# Type check plus the regression tests for Vader's own code. The Windows build and smoke workflows
# prove the packaged app; this one is the fast gate that runs on every change.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  pull_request: # no path filter: the check is required on main, so it must report on every pull request
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type check and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'

      - name: Integrity adversarial checks with reproducible evidence
        run: |
          python3 -B build/integrity/integrity.py run --plan build/integrity/plan.json --root . --evidence "$RUNNER_TEMP/engineering-integrity"
          python3 -B build/integrity/integrity.py audit --plan build/integrity/plan.json --root . --evidence "$RUNNER_TEMP/engineering-integrity"
          python3 -B -m unittest discover -s build/integrity -p test_posix_integrity.py -v

      # --ignore-scripts: native modules are not needed for type checking or these tests, and
      # skipping them keeps this job fast. esbuild ships its binary as a package, not a script.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # build/ is its own npm project (util.js needs ternary-stream, vinyl, ...), used by moduleIgnoreE2E.
      - name: Install build tool dependencies
        run: npm ci --ignore-scripts --prefix build

      # extensions/npm has its own package.json; npmExtensionPreferredPmE2E bundles its real source.
      - name: Install npm extension dependencies
        run: npm ci --ignore-scripts --prefix extensions/npm

      # Normally fetched by postinstall (skipped above). Checksum-verified against build/checksums/electron.txt.
      - name: Fetch Electron type definitions
        run: node build/npm/electronTypes.ts

      - name: Build React UI bundle
        run: npm run buildreact

      - name: Build Cline runtime bundle
        run: npm run buildcline

      - name: Type check
        run: node_modules/.bin/tsc -p src/tsconfig.json --noEmit

      - name: Regression tests
        run: |
          status=0
          for t in scmInjectionE2E browserUrlPolicyE2E policyBypassE2E mcpServerEnvE2E discoveryUrlE2E moduleIgnoreE2E importCyclesE2E xmlToolParserE2E convertMessagesE2E reactTypecheckE2E providerCatalogE2E cloudModelListE2E searchRegexGuardE2E providerSdkE2E browserPrivacyArgsE2E unconnectedModulesE2E electronChecksumsE2E npmExtensionPreferredPmE2E shippedAdvisoriesE2E bracesPatchE2E buildToolPatchesE2E symlinkPolicyE2E vendorProvidersE2E settingsPortabilityE2E gitSafetyE2E externalAgentE2E agentRobustnessE2E policyCommandPathsE2E agentPromptE2E policyPathFuzzE2E contextBudgetE2E editMatchingE2E toolSupportE2E nativeToolFallbackE2E taskListE2E repoMapE2E modelPickerE2E workspaceRulesE2E marketplaceTrustE2E liveSourcesE2E agentCatalogE2E usageAccountingE2E agentOverviewE2E worktreeConflictE2E addonsProvidersE2E shellModelE2E runStateModelE2E chatExportE2E settingsInputE2E gateModelE2E policyGateRulesE2E slashCommandsE2E contextSourcesE2E attachmentRulesE2E outputFoldE2E checkpointModelE2E mcpStateWordsE2E externalAgentWordsE2E browserErrorWordsE2E parallelRunModelE2E backupModelE2E settingsSearchE2E editErrorWordsE2E imageRulesE2E taskCopyModelE2E gitWorktreeCopyE2E updateE2E managedSettingsE2E skillMatchE2E mcpToolReviewE2E terminalInputE2E codebaseIndexE2E codebaseIndexerE2E checkpointFileOpsE2E diagnosticsDeltaE2E awaitOutputE2E nextEditE2E nestedRulesE2E semanticE2E semanticIndexerE2E localEmbedderE2E staticEmbedderE2E lintDeltaE2E agentIgnoreE2E; do
            echo "::group::$t"
            node "src/vs/workbench/contrib/vader/test/$t.mjs" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Startup and MCP lifecycle regressions (isolated services)
        run: |
          node src/vs/workbench/contrib/vader/test/startupServicesE2E.mjs
          node src/vs/workbench/contrib/vader/test/mcpLifecycleE2E.mjs
            node src/vs/workbench/contrib/vader/test/fileWatchLifecycleE2E.mjs

      - name: Test model server speaks the OpenAI protocol as the official SDK expects
        run: node src/vs/workbench/contrib/vader/test/e2e/modelServerE2E.mjs

      - name: Agent runtime bundle in a real browser (no Node)
        run: |
          npx playwright-core install --with-deps chromium
          node src/vs/workbench/contrib/vader/test/windowLayersE2E.mjs
          node src/vs/workbench/contrib/vader/test/clineBundleBrowserE2E.mjs
          node src/vs/workbench/contrib/vader/test/addonsUiE2E.mjs
          node src/vs/workbench/contrib/vader/test/shellUiE2E.mjs
          node src/vs/workbench/contrib/vader/test/onboardingUiE2E.mjs
          node src/vs/workbench/contrib/vader/test/settingsUiE2E.mjs
          node src/vs/workbench/contrib/vader/test/chatUiE2E.mjs
          node src/vs/workbench/contrib/vader/test/windowUiE2E.mjs
          node src/vs/workbench/contrib/vader/test/pickerUiE2E.mjs
