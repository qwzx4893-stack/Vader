name: CI

# Type check plus the regression tests for Vader's own code. The Windows build and smoke workflows
# prove the packaged app; this one is the fast gate that runs on every change.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'build/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'build/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type check and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'

      # --ignore-scripts: native modules are not needed for type checking or these tests, and
      # skipping them keeps this job fast. esbuild ships its binary as a package, not a script.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # build/ is its own npm project (util.js needs ternary-stream, vinyl, ...), used by moduleIgnoreE2E.
      - name: Install build tool dependencies
        run: npm ci --ignore-scripts --prefix build

      # extensions/npm has its own package.json; npmExtensionPreferredPmE2E bundles its real source.
      - name: Install npm extension dependencies
        run: npm ci --ignore-scripts --prefix extensions/npm

      # Normally fetched by postinstall (skipped above). Checksum-verified against build/checksums/electron.txt.
      - name: Fetch Electron type definitions
        run: node build/npm/electronTypes.ts

      - name: Build React UI bundle
        run: npm run buildreact

      - name: Build Cline runtime bundle
        run: npm run buildcline

      - name: Type check
        run: node_modules/.bin/tsc -p src/tsconfig.json --noEmit

      - name: Regression tests
        run: |
          status=0
          for t in scmInjectionE2E browserUrlPolicyE2E policyBypassE2E mcpServerEnvE2E discoveryUrlE2E moduleIgnoreE2E importCyclesE2E xmlToolParserE2E convertMessagesE2E reactTypecheckE2E providerCatalogE2E cloudModelListE2E searchRegexGuardE2E providerSdkE2E browserPrivacyArgsE2E unconnectedModulesE2E electronChecksumsE2E npmExtensionPreferredPmE2E shippedAdvisoriesE2E bracesPatchE2E buildToolPatchesE2E; do
            echo "::group::$t"
            node "src/vs/workbench/contrib/void/test/$t.mjs" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Test model server speaks the OpenAI protocol as the official SDK expects
        run: node src/vs/workbench/contrib/void/test/e2e/modelServerE2E.mjs

      - name: Agent runtime bundle in a real browser (no Node)
        run: |
          npx playwright-core install --with-deps chromium
          node src/vs/workbench/contrib/void/test/clineBundleBrowserE2E.mjs
