name: Windows E2E

# Installs the Windows installer produced by a Windows Build run and drives the REAL app through its UI with the
# end-to-end suite (src/vs/workbench/contrib/void/test/e2e): chat, every agent tool (terminal, browser, MCP, edits),
# Quick Edit / Apply / Autocomplete / commit messages, ordinary editor use, restart persistence.
# The model is a protocol-faithful stand-in server (validated against the official `openai` SDK by ci.yml), so the run is
# deterministic. With `real_llm` it additionally runs a small REAL model (Ollama) through the same app.
# Manual only; never builds or publishes anything.

on:
  # Dispatching by name only works once this file is on the default branch; until then a push that touches it
  # (on the validation branch only) starts the same run against that branch's latest successful Windows Build.
  push:
    branches: [upgrade/vscode-1.136.2]
    paths: ['.github/workflows/windows-e2e.yml', '.github/e2e-only.txt', 'src/vs/workbench/contrib/void/test/e2e/**']
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Windows Build run id whose installer artifact to test (empty = latest successful build of this branch)'
        required: false
        default: ''
      real_llm:
        description: 'Also run the suite against a real small model served by Ollama'
        required: false
        default: 'true'
      only:
        description: 'Regex over "<group> <scenario>" to run only some scenarios (empty = all)'
        required: false
        default: ''
      real_llm_model:
        description: 'Ollama model for the real-model run'
        required: false
        default: 'qwen2.5:1.5b'

permissions:
  contents: read
  actions: read

jobs:
  e2e:
    name: E2E on ${{ github.event.inputs.run_id && format('build run {0}', github.event.inputs.run_id) || 'the latest build of this branch' }}
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      RUN_ID: ${{ github.event.inputs.run_id }}
      REAL_LLM: ${{ github.event.inputs.real_llm || 'true' }}
      REAL_LLM_MODEL_NAME: ${{ github.event.inputs.real_llm_model || 'qwen2.5:1.5b' }}
      INSTALL_DIR: C:\VaderApp
    steps:
      - name: Checkout (test sources only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            src/vs/workbench/contrib/void/test
            .github/e2e-only.txt
            package.json
            .nvmrc
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: '.nvmrc'

      - name: Download and install the installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not $env:RUN_ID) {
            $env:RUN_ID = gh run list --repo ${{ github.repository }} --workflow windows-build.yml --branch '${{ github.ref_name }}' --status success --limit 1 --json databaseId --jq '.[0].databaseId'
            "using build run $env:RUN_ID"
          }
          gh run download $env:RUN_ID --repo ${{ github.repository }} --name vader-win32-x64-setup --dir dl
          $exe = Get-ChildItem dl -Recurse -Filter *.exe | Select-Object -First 1
          $p = Start-Process $exe.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=$env:INSTALL_DIR",'/MERGETASKS=!runcode' -Wait -PassThru
          "installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { exit 1 }
          $main = Get-ChildItem $env:INSTALL_DIR -Filter *.exe | Where-Object { $_.Name -notlike 'unins*' } | Sort-Object Length -Descending | Select-Object -First 1
          "VADER_EXE=$($main.FullName)" >> $env:GITHUB_ENV

      - name: Install the MCP SDK next to a copy of the MCP fixture server
        shell: pwsh
        run: |
          # the sparse checkout has no node_modules; the fixture needs the same SDK versions the app uses
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $sdk = $pkg.dependencies.'@modelcontextprotocol/sdk'; $zod = $pkg.dependencies.zod
          New-Item -ItemType Directory -Force $env:RUNNER_TEMP\mcp | Out-Null
          Push-Location $env:RUNNER_TEMP\mcp
          npm init -y | Out-Null
          npm install "@modelcontextprotocol/sdk@$sdk" "zod@$zod" --no-audit --no-fund
          Pop-Location
          Copy-Item src\vs\workbench\contrib\void\test\fixtures\fixtureMcpServer.mjs $env:RUNNER_TEMP\mcp\
          "E2E_MCP_FIXTURE=$env:RUNNER_TEMP\mcp\fixtureMcpServer.mjs" >> $env:GITHUB_ENV
          # fast iteration: a regex in .github/e2e-only.txt limits the scripted run (empty = everything)
          $only = (Get-Content .github/e2e-only.txt -Raw -ErrorAction SilentlyContinue)
          if ("${{ github.event.inputs.only }}") { $only = "${{ github.event.inputs.only }}" }
          if ($only) { "E2E_ONLY=$($only.Trim())" >> $env:GITHUB_ENV; "restricting the scripted run to: $($only.Trim())" }

      - name: Install Playwright (client only) and git identity
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:RUNNER_TEMP\pw | Out-Null
          Push-Location $env:RUNNER_TEMP\pw
          npm init -y | Out-Null
          $env:PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = '1'
          npm install playwright-core@1.52.0 --no-audit --no-fund
          Pop-Location
          "PW_CORE=$env:RUNNER_TEMP\pw\node_modules\playwright-core" >> $env:GITHUB_ENV
          git config --global user.email e2e@example.com
          git config --global user.name e2e

      - name: Probe the SkillNet endpoint over https and http (informational)
        shell: pwsh
        continue-on-error: true
        run: |
          foreach ($u in 'https://api-skillnet.openkg.cn/', 'http://api-skillnet.openkg.cn/') {
            try { $r = Invoke-WebRequest $u -UseBasicParsing -TimeoutSec 30 -MaximumRedirection 0 -ErrorAction Stop; "$u -> $($r.StatusCode)" }
            catch { "$u -> $($_.Exception.Message)" }
          }

      - name: Run the end-to-end suite (scripted model)
        shell: pwsh
        env:
          E2E_OUT: e2e-out
          E2E_PRISTINE: '1'
          E2E_SCENARIO_TIMEOUT: '150000'
        run: node src/vs/workbench/contrib/void/test/e2e/suite.mjs

      - name: Start Ollama and pull the model
        if: ${{ always() && env.REAL_LLM == 'true' }}
        id: ollama
        shell: pwsh
        continue-on-error: true
        run: |
          Invoke-WebRequest https://github.com/ollama/ollama/releases/latest/download/ollama-windows-amd64.zip -OutFile ollama.zip
          Expand-Archive ollama.zip -DestinationPath ollama
          $env:OLLAMA_HOST = '127.0.0.1:11434'
          Start-Process -FilePath .\ollama\ollama.exe -ArgumentList 'serve' -RedirectStandardOutput ollama.log -RedirectStandardError ollama.err.log -WindowStyle Hidden
          for ($i = 0; $i -lt 30; $i++) { try { Invoke-RestMethod http://127.0.0.1:11434/api/version | Out-Null; break } catch { Start-Sleep 2 } }
          .\ollama\ollama.exe pull "$env:REAL_LLM_MODEL_NAME"
          "--- model smoke (direct, bypassing Vader)"
          $body = @{ model = $env:REAL_LLM_MODEL_NAME; messages = @(@{ role = 'user'; content = 'Say PONG' }); stream = $false } | ConvertTo-Json -Depth 5
          (Invoke-RestMethod -Method Post -Uri http://127.0.0.1:11434/v1/chat/completions -ContentType 'application/json' -Body $body).choices[0].message.content

      - name: Run the suite against the real model
        if: ${{ always() && env.REAL_LLM == 'true' && steps.ollama.outcome == 'success' }}
        shell: pwsh
        env:
          E2E_OUT: e2e-out-real
          E2E_ONLY: 'real-llm'
          REAL_LLM_MODEL: ${{ github.event.inputs.real_llm_model || 'qwen2.5:1.5b' }}
          REAL_LLM_BASEURL: http://127.0.0.1:11434/v1
          E2E_SCENARIO_TIMEOUT: '900000'
        run: |
          # a server started in an earlier step may not survive it: make sure Ollama is answering right before the suite
          try { Invoke-RestMethod http://127.0.0.1:11434/api/version | Out-Null; "ollama is up" }
          catch {
            "ollama is down - restarting"
            Start-Process -FilePath .\ollama\ollama.exe -ArgumentList 'serve' -RedirectStandardOutput ollama2.log -RedirectStandardError ollama2.err.log -WindowStyle Hidden
            for ($i = 0; $i -lt 30; $i++) { try { Invoke-RestMethod http://127.0.0.1:11434/api/version | Out-Null; break } catch { Start-Sleep 2 } }
          }
          "--- direct request through the same base URL the app will use"
          $body = @{ model = $env:REAL_LLM_MODEL; messages = @(@{ role = 'user'; content = 'Say PONG' }); stream = $false } | ConvertTo-Json -Depth 5
          (Invoke-RestMethod -Method Post -Uri "$env:REAL_LLM_BASEURL/chat/completions" -ContentType 'application/json' -Headers @{ Authorization = 'Bearer ollama' } -Body $body).choices[0].message.content
          node src/vs/workbench/contrib/void/test/e2e/suite.mjs

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-out
          path: |
            e2e-out
            e2e-out-real
            ollama.err.log
            ollama2.err.log
          retention-days: 7
          if-no-files-found: ignore
